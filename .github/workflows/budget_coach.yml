name: Budget Coach

on:
  schedule:
    # Palkkapäivä-check: aja pv 11-14 klo 06:00 UTC (09:00 Helsinki)
    - cron: '0 6 11-14 * *'
    # Viikkoraportti: sunnuntai klo 07:00 UTC (10:00 Helsinki)
    - cron: '0 7 * * 0'
    # Päivittäinen hälytyscheck: klo 16:00 UTC (19:00 Helsinki)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Viestityyppi'
        required: false
        default: 'auto'
        type: choice
        options: [auto, payday, weekly, alert, status]

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run budget coach
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE=${{ github.event.inputs.mode || 'auto' }}
          python scripts/budget_notify.py $MODE
